name: release

# Patch-bump, tag and publish to Clojars when a push changes the library.
# README / CI-only commits do not mint a version: a published pom is immutable.
#
# CI owns patches: push the feature commit only and this workflow picks the
# number (bump -> changelog -> commit -> tag -> deploy). A minor or major is a
# human-set VERSION, released as written.
# Secrets (hive-agi org): CLOJARS_USERNAME, CLOJARS_DEPLOY_TOKEN.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'deps.edn'
      - 'version.edn'
      - 'test/**'
      - '.github/workflows/release.yml'
      # A human-set VERSION (a minor or major) rides the push, as in hive-agent.
      - 'VERSION'
  # A push mints a patch unless VERSION names an untagged version, which is
  # released as written. A dispatch bumps by its level.
  workflow_dispatch:
    inputs:
      level:
        description: 'Version bump level'
        required: false
        default: 'patch'
        type: choice
        options: [patch, minor, major]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: m2-${{ runner.os }}-

      # Gate before the bump: a red suite must not mint, tag or ship a version.
      # Unit suite only: the integration suite wants melt on PATH.
      - name: Test
        run: clojure -M:test unit

      # The release number comes from the tags, not from a commit back to main.
      # VERSION in the tree is a FLOOR (raise it in a staging PR to open a new
      # minor line); this run releases patch+1 of max(VERSION, newest v* tag).
      - name: Resolve release base from tags
        run: |
          set -euo pipefail
          FLOOR=$(tr -d '[:space:]' < VERSION)
          LAST=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1 | sed 's/^v//')
          BASE=$(printf '%s\n%s\n' "$FLOOR" "${LAST:-$FLOOR}" | sort -V | tail -n1)
          echo "VERSION floor $FLOOR, newest tag ${LAST:-none}: base $BASE"
          printf '%s\n' "$BASE" > VERSION

      - name: Bump version
        # Pinned release (hive-agent): a VERSION without its tag is a line a
        # human set, released as written. A tagged VERSION is already out, so
        # a push mints the next patch; a dispatch bumps by its level.
        run: |
          VER=$(tr -d '[:space:]' < VERSION)
          if [ -z "${{ inputs.level }}" ] && ! git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            echo "VERSION $VER is untagged: releasing it as written"
          else
            clojure -T:build bump :level :${{ inputs.level || 'patch' }}
          fi

      - name: Regenerate changelog
        run: clojure -T:build changelog

      - name: Tag
        run: |
          set -euo pipefail
          VER=$(tr -d '[:space:]' < VERSION)
          git config user.name  "hive-ci"
          git config user.email "ci@hive-agi.local"
          # Tag only, no commit: a version-bump commit on main is one staging
          # lacks, and it made every next staging->main PR conflict in VERSION.
          # Annotated, so the next run's tag scan and `git describe` see it.
          git tag -a "v$VER" -m "release $VER"
          git push origin "refs/tags/v$VER"

      - name: Deploy
        env:
          # deps-deploy reads CLOJARS_PASSWORD; the org secret is CLOJARS_DEPLOY_TOKEN.
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: clojure -T:build deploy
